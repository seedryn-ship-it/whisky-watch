# whisky-watch 설정 파일
# 변경 후 `python -m whiskywatch diagnose` 로 수집이 되는지, `python -m whiskywatch run --dry-run` 으로 알림 모양을 확인하세요.

# ─────────────────────────────────────────────────────────────
# 1) 감시할 키워드
#    - 키워드의 모든 단어가 상품명에 들어 있으면 감시 대상입니다 (대소문자/악센트 무시).
#    - 한글 상품명(스프링뱅크, 헤이즐번, 로컬 발리, 15년 ...)도 자동으로 영문으로 바꿔서 비교합니다.
#    - 이 목록은 '걸러내는 기준'입니다. 샵의 브랜드/목록 페이지를 통째로 읽은 뒤 여기에 맞는 상품만 남깁니다.
#      (검색창을 쓰는 샵 - search_url 지정 - 에서만 키워드가 검색어로도 쓰입니다.)
#    - 원하는 제품은 여기에 한 줄 추가하면 끝입니다.
# ─────────────────────────────────────────────────────────────
watchlist:
  - springbank
  - springbank local barley
  - hazelburn
  - longrow
  - kilkerran
  # 고숙성 / 희귀 라인업 (검색 누락 방지용 세부 키워드)
  - springbank 15
  - springbank 18
  - springbank 21
  - springbank 25
  - springbank 30
  - springbank cask strength
  - springbank vintage
  - springbank private
  - hazelburn cask strength
  # 대체 증류소 예시 (필요하면 주석 해제)
  # - clynelish 14

# 이 단어가 들어간 상품(미니어처, 잔, 세트 등)은 무시
# exclude_words: [miniature, sample, glass, "5cl"]   # 지정하면 기본 목록을 통째로 대체합니다

# 허용 용량(ml). 상품명에서 용량을 못 읽으면 700ml 로 가정하고 알림에 '(추정)'을 표시합니다.
allowed_volumes_ml: [700, 750, 1000]

# 알림 문구의 [고숙성/희귀] 태그 기준: 숙성 18년 이상, 빈티지 2005년 이하, 또는 아래 단어 포함
# rare_words: [private, society, "single cask", rundlets]

# ─────────────────────────────────────────────────────────────
# 2) 알림 조건
# ─────────────────────────────────────────────────────────────
alert:
  # 기준가(중앙값)보다 이 비율(%) 이상 싸면 알림.
  # 0 으로 두면 '중앙값보다 조금이라도 싸면' 알림이라 하루에도 여러 번 울릴 수 있어 기본은 5% 입니다.
  discount_pct: 5
  # 기준가 계산에 필요한 최소 표본 수 (같은 상품의 '샵·일' 단위 최저 도착가 개수)
  min_samples: 6
  baseline_days: 180        # 기준가 계산에 쓰는 최근 기간
  realert_hours: 48         # 같은 상품 재알림 최소 간격
  realert_drop_pct: 2       # 마지막 알림가보다 이만큼 더 싸지면 간격과 무관하게 재알림
  fail_alert_after: 12      # 같은 샵이 연속 N회 실패하면 1회 점검 알림
  max_alerts_per_run: 15

# 이력이 쌓이기 전(또는 이력이 적은 희귀 제품)에는 직접 기준가(도착가, 원)를 지정할 수 있습니다.
# 이력 표본이 충분하면 이력 중앙값이 우선합니다.
seed_prices: []
#  - match: "springbank 10 local barley"
#    krw: 450000
#  - match: "hazelburn 12"
#    krw: 320000

# 내가 정한 '목표가'(도착가 = 상품가 + 한국 세금 + 배송비, 원). 아래 규칙에 맞는 상품은 이력이 없어도 바로,
# 도착가가 목표가 이하이면 알림을 보냅니다(이 상품들은 '이력 중앙값 대비 5%' 규칙 대신 이 가격만 봅니다).
# 규칙에 안 걸리는 상품(Local Barley, 독립병입, 그 밖의 증류소 등)은 기존처럼 이력 중앙값 기준입니다.
# tokens 를 비워 두면 '에디션 표시가 없는 일반 제품'만 해당합니다. Local Barley·Cask Strength·100 Proof·독립병입 등은 제외됩니다.
# 도착가에는 환율·배송비 추정이 들어가므로 실제 결제 금액과 몇 % 다를 수 있습니다.
price_caps:
  - {label: "스프링뱅크 10년", distillery: springbank, age: 10, tokens: [], max_krw: 250000}
  - {label: "스프링뱅크 15년", distillery: springbank, age: 15, tokens: [], max_krw: 350000}
  - {label: "스프링뱅크 12년 캐스크 스트렝스", distillery: springbank, age: 12, tokens: [cask-strength], max_krw: 350000}
  - {label: "스프링뱅크 18년", distillery: springbank, age: 18, tokens: [], max_krw: 700000}
  - {label: "스프링뱅크 21년", distillery: springbank, age: 21, tokens: [], max_krw: 1000000}

# ─────────────────────────────────────────────────────────────
# 3) 한국 세금 / 환율
# ─────────────────────────────────────────────────────────────
tax:
  # 관세율 20% 는 FTA 원산지증명서(C/O)가 없을 때의 기본값(보수적).
  # 스코틀랜드산 위스키에 한-영 FTA 를 적용받을 수 있다면 0 으로 바꾸세요.
  tariff_rate: 0.20
  liquor_tax_rate: 0.72
  education_tax_rate: 0.30
  vat_rate: 0.10
  exemption_usd: 150        # 소액면세: 1L 이하 1병, 물품가 150달러 이하 -> 관세·부가세 면제 (주세·교육세는 부과)

assume_bottles: 1           # 1회 주문 병수 가정. 2병 이상이면 소액면세가 적용되지 않고 배송비는 병수로 나눠 계산
fx_card_markup_pct: 0.0     # 카드 해외결제 수수료 등을 가산하고 싶을 때 (예: 1.5)
price_sanity: [25, 30000]   # 샵 통화 기준, 이 범위 밖 가격은 파싱 오류로 보고 무시

# ─────────────────────────────────────────────────────────────
# 4) 감시할 샵
#    listing_urls : 브랜드/증류소 '목록 페이지' 주소들. {page} 가 있으면 1, 2, 3... 으로 바꿔 넘겨 읽습니다.
#                   글자만 쓰거나 {url: ..., pages: N} 으로 쓸 수 있습니다.
#                   TWE·Master of Malt 는 robots.txt 가 '검색' 주소를 막아 두어서, 허용된 브랜드 페이지를 씁니다.
#    search_url   : 검색창 주소({q} 검색어, {page} 페이지). robots.txt 가 허용하는 샵에서만 사용.
#    strip_vat    : 표시가에 포함된 현지 VAT 비율. 한국 수출 시 면세이므로 제외해서 계산합니다.
#    ship_base / ship_extra : 한국행 배송비 '추정치' (1병 기본 / 추가 1병당, 샵 통화).
#                 !! 예시 추정치입니다. 실제 장바구니에서 한국 주소로 확인한 금액으로 고쳐 주세요.
#    all_in       : true 면 관세·주세·교육세·부가세가 이미 가격에 들어 있는 샵(한국 직배송 전문) - 세금을 더하지 않습니다.
#    fetch        : requests(기본) | playwright (JS 검사/차단이 있을 때)
# ─────────────────────────────────────────────────────────────
shops:
  - id: twe
    name: The Whisky Exchange
    currency: GBP
    enabled: false
    note: "GitHub 서버 IP 에서 HTTP 403 으로 차단됨. 집 PC 실행 또는 fetch: playwright 로 해결되면 enabled: true 로 바꾸세요."
    listing_urls:
      - url: "https://www.thewhiskyexchange.com/b/40/springbank-single-malt-scotch-whisky?pg={page}"
        pages: 8
      - "https://www.thewhiskyexchange.com/b/40/hazelburn-single-malt-scotch-whisky?pg={page}"
      - "https://www.thewhiskyexchange.com/b/40/longrow-single-malt-scotch-whisky?pg={page}"
      - "https://www.thewhiskyexchange.com/b/40/kilkerran-single-malt-scotch-whisky?pg={page}"
    selectors:
      card: "li.product-grid__item"
      link: "a.product-card"
      title: "p.product-card__name, p.product-card__meta"
      price: "p.product-card__price"
    strip_vat: 0.20
    ship_base: 30
    ship_extra: 6
    max_pages: 4

  - id: mom
    name: Master of Malt
    currency: GBP
    enabled: false
    note: "Vercel 보안 검사(JS 확인 페이지)가 봇을 막습니다. 아래 주소도 아직 확인되지 않은 추정값입니다. 켜기 전에 브라우저에서 실제 증류소 페이지 주소를 확인하세요."
    listing_urls:
      - "https://www.masterofmalt.com/distilleries/springbank-whisky/"
    strip_vat: 0.20
    ship_base: 25
    ship_extra: 6

  - id: whiskybase
    name: Whiskybase Shop
    currency: EUR
    preset: lightspeed
    listing_urls:
      - "https://shop.whiskybase.com/us/brands/springbank/"
      - "https://shop.whiskybase.com/us/brands/hazelburn/"
      - "https://shop.whiskybase.com/us/brands/longrow/"
      - "https://shop.whiskybase.com/us/brands/kilkerran/"
    strip_vat: 0.21
    ship_base: 35
    ship_extra: 8

  # ── Shopify 기반 샵 4곳 (점검 결과 GitHub 러너에서 수집 가능, 스프링뱅크 컬렉션 확인됨) ──
  # !! 아래 strip_vat 은 '모르면 0(세금 안 뺌)'으로 둔 보수적 값입니다. 가격이 실제보다 비싸게 계산될 뿐 가짜 알림은 나지 않습니다.
  #    실제 상품 페이지와 diagnose 로그의 가격을 비교해서 목록 JSON 가격에 VAT 가 포함돼 있으면 0.20(영국) / 0.19(독일) 로 바꾸세요.
  # !! ship_base / ship_extra 는 배송비 추정치입니다. WIO 만 공식 요금표(Zone 9a) 값이고 나머지는 추정입니다.
  # !! 한국 배송 가능 여부는 WIO(가능, 공식 확인)·Hedonism(국가 선택에 있음)·Whisky Galore(가능)만 확인됐고,
  #    inn-out-shop 은 'DHL 전세계 배송'이라고만 되어 있어 장바구니에서 한국 주소로 확인이 필요합니다.
  #    (Still Spirit 은 한국이 배송 국가 목록에 없어서 제외했습니다.)
  - id: wio
    name: Whisky International Online (UK)
    currency: GBP
    type: shopify
    listing_urls:
      - url: "https://whiskyinternationalonline.com/collections/springbank-whisky/products.json?limit=250&page={page}"
        pages: 3
    strip_vat: 0            # 결제 시 영국 VAT 가 빠진다고 안내함. JSON 가격이 VAT 포함이면 0.20 으로
    ship_base: 37.95        # Zone 9a(한국) 공식 요금
    ship_extra: 10

  - id: hedonism
    name: Hedonism Wines (UK)
    currency: GBP
    type: shopify
    listing_urls:
      - url: "https://hedonism.co.uk/collections/springbank-whisky/products.json?limit=250&page={page}"
        pages: 3
    strip_vat: 0
    ship_base: 45           # 추정치
    ship_extra: 10

  - id: innout
    name: Inn-Out Shop (Germany)
    currency: EUR
    type: shopify
    listing_urls:
      - url: "https://inn-out-shop.com/collections/springbank/products.json?limit=250&page={page}"
        pages: 3
    strip_vat: 0            # 독일 VAT 19% 는 비유럽 수출 시 빠질 수 있으나 확인 전까지 보수적으로 0
    ship_base: 45           # 추정치 (DHL 국제)
    ship_extra: 12

  - id: galore
    name: Whisky Galore (New Zealand)
    currency: NZD
    type: shopify
    listing_urls:
      - url: "https://www.whiskygalore.co.nz/collections/springbank/products.json?limit=250&page={page}"
        pages: 2
      - "https://www.whiskygalore.co.nz/collections/longrow/products.json?limit=250"
      - "https://www.whiskygalore.co.nz/collections/hazelburn/products.json?limit=250"
      - "https://www.whiskygalore.co.nz/collections/kilkerran/products.json?limit=250"
    strip_vat: 0            # 해외 운임은 GST 면제라고 안내. 상품 GST(15%) 제외 여부는 미확인
    ship_base: 120          # 추정치 (샵이 무게·크기에 따라 따로 청구)
    ship_extra: 30

  # ── Nickolls & Perks (영국, WooCommerce) ──
  # 상품 카드에 'VAT 제외 가격(excl. VAT)'이 따로 표시되어 그 가격을 씁니다(수출 시 영국 VAT 제외 가정 -> strip_vat: 0).
  # robots.txt 에 Crawl-delay 10초가 있어 프로그램이 요청 사이를 10초 이상 띄웁니다(한 회차 약 1분).
  # !! 배송 안내 페이지에 한국이 명시되어 있지 않습니다('Rest of the World' 만 표기). 장바구니에서 한국 배송 가능 여부와 배송비를 확인하세요.
  # !! 신제품은 '가구당 최대 1병' 제한이 있는 경우가 많습니다. ship_base/ship_extra 는 추정치입니다.
  - id: nickolls
    name: Nickolls & Perks (UK)
    currency: GBP
    preset: woodmart
    listing_urls:
      - url: "https://nickollsandperks.com/producer/springbank/page/{page}/"
        pages: 3
      - "https://nickollsandperks.com/producer/kilkerran/"
      - "https://nickollsandperks.com/producer/longrow/"
    strip_vat: 0
    ship_base: 45
    ship_extra: 10

  # ── 아래 4곳은 '접속은 되지만 구조를 사람이 봐야 함' 그룹에서 실제 페이지 구조/robots.txt 를 확인해 추가한 샵입니다 ──
  # !! 4곳 모두 한국 배송 가능 여부·배송비를 확인하지 못했습니다. 배송비(ship_base/ship_extra)는 추정치이니
  #    관심 있는 상품이 알림으로 오면 장바구니에서 한국 주소로 실제 배송비를 꼭 확인하세요.

  # Cadenhead's (캠벨타운 독립병입사, WooCommerce). robots.txt 에 제한 없음.
  # 지금은 스프링뱅크/헤이즐번/킬커런 페이지가 비어 있을 때가 많아서 allow_empty(0건이어도 정상)로 둡니다. Longrow 전용 페이지는 없음.
  # 영국 VAT 는 수출 시 빠지는지 확인 전이라 0(세금 안 뺌)으로 둡니다.
  - id: cadenhead
    name: Cadenhead's (UK)
    currency: GBP
    allow_empty: true
    add_tokens: [independent]   # Cadenhead's 병은 전부 독립병입(IB)이라 공식 병과 기준가를 섞지 않는다
    listing_urls:
      - url: "https://cadenhead.shop/distillery/springbank/page/{page}/"
        pages: 3
      - "https://cadenhead.shop/distillery/hazelburn-springbank-distillery/"
      - "https://cadenhead.shop/distillery/kilkerran/"
    selectors:
      card: "div.product.type-product"
      link: "a.mainLink"
      title: "h2.woocommerce-loop-product__title"
      price: "p.price .amount"
      sold_out: ".outofstock"
    strip_vat: 0
    ship_base: 46
    ship_extra: 8

  # Dunkeld Whisky Box (스코틀랜드 소규모 샵, ePages). 브랜드 목록은 자바스크립트로 그려져서 못 읽고,
  # 검색 페이지(/search?q=)는 서버에서 그려주고 robots.txt 도 허용해서 그걸 씁니다. 파는 종류가 적어(스프링뱅크 계열 5~7종) 기준가 표본이 천천히 쌓입니다.
  - id: dunkeld
    name: Dunkeld Whisky Box (UK)
    currency: GBP
    listing_urls:
      - "https://www.dunkeldwhiskybox.co.uk/search?q=springbank"
      - "https://www.dunkeldwhiskybox.co.uk/search?q=hazelburn"
    selectors:
      card: "div.product-item"
      link: "a.product-item-link"
      title: "h2.product-item-title"
      price: "h3.product-item-price-new span[aria-hidden]"
      sold_out: 'link[itemprop="availability"][href*="OutOfStock"]'
    strip_vat: 0
    ship_base: 45
    ship_extra: 10

  # Whiskyfass (독일, JTL-Shop). 상품명에 용량이 없어서 '0,70 l / 55,5% vol.' 이 적힌 부분을 제목에 이어 붙입니다(용량 500ml 는 자동 제외).
  # 표시가는 독일 VAT 19% 포함가로 보이나(수출 시 빠질 수 있음) 확인 전이라 0 으로 둡니다: 계산가가 실제보다 높게 나올 뿐 가짜 알림은 없습니다.
  - id: whiskyfass
    name: Whiskyfass (Germany)
    currency: EUR
    listing_urls:
      - "https://whiskyfass.de/springbank?af=50"
      - "https://whiskyfass.de/hazelburn?af=50"
      - "https://whiskyfass.de/longrow?af=50"
      - "https://whiskyfass.de/kilkerran?af=50"
    selectors:
      card: "form.form-basket"
      link: ".productbox-head a"
      title: ".productbox-title .title, .base_price .value"
      price: "div.price.productbox-price"
    strip_vat: 0
    ship_base: 45
    ship_extra: 12

  # Rare Vintage Whisky (네덜란드, ePages). 목록 페이지가 20~100개씩 끊겨 있어서 페이지 번호가 붙는 주소를 씁니다(스프링뱅크 카테고리는 약 200건).
  # 품절 상품에 자리표시 가격(예: 20유로)이 찍혀 있어서 skip_sold_out_history 로 품절 상품 가격은 기준가에 반영하지 않습니다.
  # 한 회차에 요청이 13번 정도 나갑니다.
  - id: rvw
    name: Rare Vintage Whisky (NL)
    currency: EUR
