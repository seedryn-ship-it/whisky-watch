{
 "name": "setup-check",
 "on": {
  "workflow_dispatch": {
   "inputs": {
    "term": {
     "description": "search term",
     "required": false,
     "default": "springbank"
    }
   }
  }
 },
 "jobs": {
  "check": {
   "runs-on": "ubuntu-latest",
   "timeout-minutes": 15,
   "steps": [
    {
     "uses": "actions/checkout@v4"
    },
    {
     "uses": "actions/setup-python@v5",
     "with": {
      "python-version": "3.12",
      "cache": "pip"
     }
    },
    {
     "run": "pip install -r requirements.txt"
    },
    {
     "name": "Telegram test",
     "env": {
      "TELEGRAM_BOT_TOKEN": "${{ secrets.TELEGRAM_BOT_TOKEN }}",
      "TELEGRAM_CHAT_ID": "${{ secrets.TELEGRAM_CHAT_ID }}"
     },
     "run": "python -m whiskywatch test-telegram"
    },
    {
     "name": "Diagnose shops",
     "if": "always()",
     "env": {
      "TERM_INPUT": "${{ inputs.term }}"
     },
     "run": "python -m whiskywatch diagnose --term \"$TERM_INPUT\""
    },
    {
     "name": "Tax sanity check",
     "if": "always()",
     "run": "python -m whiskywatch tax --price 120 --currency GBP --strip-vat 0.20 --shipping 30"
    }
   ]
  }
 }
}
